import static org.gradle.api.JavaVersion.VERSION_17

buildscript {

    ext.cordaBuildEdition = System.getenv("CORDA_BUILD_EDITION")?.trim() ?: "Corda Open Source"

    ext.cordaRevision = {
        try {
            "git rev-parse HEAD".execute().text.trim()
        } catch (Exception ignored) {
            logger.warn("git is unavailable in build environment")
            "unknown"
        }
    }()

    ext.quasar_exclusions = [
            'co.paralleluniverse**',
            'groovy**',
            'com.esotericsoftware.**',
            'jdk**',
            'junit**',
            'kotlin**',
            'net.rubygrapefruit.**',
            'org.gradle.**',
            'org.apache.**',
            'org.jacoco.**',
            'org.junit**',
            'org.slf4j**',
            'worker.org.gradle.**',
            'org.mockito.kotlin**',
            'org.assertj**',
            'org.hamcrest**',
            'org.mockito**',
            'org.opentest4j**'
    ]

    repositories {
        mavenLocal()
        // Use system environment to activate caching with Artifactory,
        // because it is actually easier to pass that during parallel build.
        // NOTE: it has to be a name of a virtual repository with all
        // required remote or local repositories!
        if (System.getenv("CORDA_USE_CACHE")) {
            maven {
                name "R3 Maven remote repositories"
                url "${artifactoryContextUrl}/${System.getenv("CORDA_USE_CACHE")}"
                authentication {
                    basic(BasicAuthentication)
                }
                credentials {
                    username = System.getenv('CORDA_ARTIFACTORY_USERNAME')
                    password = System.getenv('CORDA_ARTIFACTORY_PASSWORD')
                }
            }
        } else {
            maven {
                url "${publicArtifactURL}/corda-dependencies-dev"
                content {
                    includeGroupByRegex 'net\\.corda(\\..*)?'
                    includeGroupByRegex 'com\\.r3(\\..*)?'
                }
            }
            maven {
                url "${publicArtifactURL}/corda-releases"
                content {
                    includeGroupByRegex 'net\\.corda(\\..*)?'
                    includeGroupByRegex 'com\\.r3(\\..*)?'
                }
            }
            maven { url "${publicArtifactURL}/corda-releases" }
            maven { url "${publicArtifactURL}/corda-dependencies" }
            mavenCentral()
            maven { url "${publicArtifactURL}/jcenter-backup" }
        }
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "net.corda.plugins:quasar-utils:$gradlePluginsVersion"
    }
}

plugins {
    id 'org.jetbrains.kotlin.jvm' version "$kotlinVersion"
    id "org.ajoberstar.grgit" version "4.0.0"
    id 'corda.root-publish'
}

// If the command line project option -PversionFromGit is added to the gradle invocation, we'll resolve
// the latest git commit hash and timestamp and create a version postfix from that
if (project.hasProperty("versionFromGit")) {
    ext.versionSuffix = "-${grgit.head().dateTime.format("yyyyMMdd_HHmmss")}-${grgit.head().abbreviatedId}"
}

version = "$cordaShellReleaseVersion$versionSuffix"

logger.quiet("Corda release version: {}", version)

allprojects {

    group 'net.corda'
    version rootProject.version

    repositories {
        mavenLocal()
        if (System.getenv("CORDA_USE_CACHE")) {
            maven {
                name "R3 Maven remote repositories"
                url "${artifactoryContextUrl}/${System.getenv("CORDA_USE_CACHE")}"
                authentication {
                    basic(BasicAuthentication)
                }
                credentials {
                    username = System.getenv('CORDA_ARTIFACTORY_USERNAME')
                    password = System.getenv('CORDA_ARTIFACTORY_PASSWORD')
                }
            }
        } else {
            maven {
                url "${publicArtifactURL}/corda-dependencies"
                content {
                    includeGroupByRegex 'net\\.corda(\\..*)?'
                    includeGroupByRegex 'com\\.r3(\\..*)?'
                    includeGroup 'co.paralleluniverse'
                    includeGroup 'org.crashub'
                    includeGroup 'com.github.bft-smart'
                    includeGroup 'com.palominolabs.metrics'
                }
                metadataSources { artifact() }
            }
            maven {
                url "${publicArtifactURL}/corda-dev"
                content {
                    includeGroupByRegex 'net\\.corda(\\..*)?'
                    includeGroupByRegex 'com\\.r3(\\..*)?'
                }
            }
            maven {
                url 'https://repo.gradle.org/gradle/libs-releases'
                content {
                    includeGroup 'org.gradle'
                    includeGroup 'com.github.detro'
                }
            }
            maven { url "${publicArtifactURL}/corda-releases" }
            maven { url "${publicArtifactURL}/corda-dependencies" }
            mavenCentral()
            maven { url "${publicArtifactURL}/jcenter-backup" }
        }
    }

    tasks.withType(Jar).configureEach { task ->
        // Includes War and Ear
        manifest {
            attributes('Corda-Release-Version': cordaReleaseVersion)
            attributes('Corda-Platform-Version': cordaPlatformVersion)
            attributes('Corda-Revision': cordaRevision)
            attributes('Corda-Vendor': cordaBuildEdition)
            attributes('Automatic-Module-Name': "net.corda.${task.project.name.replaceAll('-', '.')}")
        }
    }

    tasks.register("javadocJar", Jar) {
        dependsOn(tasks.javadoc)
        archiveBaseName.set("corda-${project.name}")
        archiveClassifier.set("javadoc")
        from("${buildDir}/docs/javadoc")
    }

    configurations {
        configureEach {
            resolutionStrategy {
                eachDependency { details ->
                    if (details.requested.group == 'org.apache.sshd' && details.requested.name == 'sshd-core') {
                        details.useVersion sshdCoreVersion
                    }
                    // SNYK-JAVA-IOMICROMETER-17339194 / CVE-2026-40983
                    // SNYK-JAVA-IOMICROMETER-17260885 / CVE-2026-40984
                    // vulnerability in io.micrometer:micrometer-core@1.16.5 fixed in micrometer-core@1.16.6
                    // micrometer-core@1.16.5 is a transitive dependency via artemis-server@2.54.0
                    // force-upgrade micrometer-core to a fixed version
                    // Review when Artemis is upgraded
                    if (details.requested.group == 'io.micrometer' && details.requested.name == "micrometer-core") {
                        details.useVersion micrometerCoreVersion
                    }

                    // SNYK-JAVA-IONETTY-17311221 / CVE-2026-48059
                    // SNYK-JAVA-IONETTY-17262766 / CVE-2026-44893
                    // Vulnerability in io.netty:netty-codec-haproxy, which is a transitive dependency
                    // of artemis-server@2.54.03
                    if (details.requested.group == 'io.netty' && details.requested.name.startsWith('netty-')) {
                        details.useVersion nettyVersion
                    }

                    // SNYK-JAVA-ORGAPACHECOMMONS-16690473 / CVE-2026-45205
                    // vulnerability in org.apache.commons:commons-configuration2@2.13.0, fixed in commons-configuration2@2.15.0
                    // commons-configuration2@2.13.0 is a transitive dependency via artemis-amqp-protocol@2.54.0
                    // force-upgrade to commons-configuration2@2.15.0 to fix the issue
                    // Review this when Artemis is upgraded
                    if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-configuration2') {
                        details.useVersion commonsConfiguration2Version
                    }
                }
            }
        }

    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
}

allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation" << "-Xlint:-options" << "-parameters"
        options.compilerArgs << '-XDenableSunApiLintControl'
        options.encoding = 'UTF-8'
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            languageVersion = "1.9"
            apiVersion = "1.9"
            jvmTarget = VERSION_17
            javaParameters = true   // Useful for reflection.
            freeCompilerArgs = ['-Xjvm-default=all-compatibility']
            allWarningsAsErrors = false
        }
    }
}

ext.configureCommonPom = { pom ->
    pom.url.set("https://github.com/corda/corda-shell")
    pom.description.set("A standalone shell for interacting with Corda nodes and services.")

    pom.scm {
        url.set("https://github.com/corda/corda-shell")
    }

    pom.licenses {
        license {
            name.set("Apache-2.0")
            url.set("https://www.apache.org/licenses/LICENSE-2.0")
            distribution.set("repo")
        }
    }

    pom.developers {
        developer {
            id.set("R3")
            name.set("R3")
            email.set("dev@corda.net")
        }
    }
}

// Publish the default jar for all submodules, These are not for external consumption.
// We must generate a jar which has a pom.xml with a full dependency list for vulnerability tools to evaluate.
// The shadow jar removes this information, as those dependencies are embedded in the jar. 
subprojects {
    plugins.withId("java") {
        java {
            withSourcesJar()
        }
    }

    afterEvaluate { project ->
        if (project.name in ['shell', 'standalone-shell']) {
            apply plugin: 'maven-publish'

            publishing {
                publications {
                    "${project.name}-jarPublication"(MavenPublication) {
                        from components.java
                        artifactId = "corda-${project.name}-thin-with-deps"
                        pom {
                            name = "corda-${project.name}-thin-with-deps"
                            description = "Corda ${project.name} for vulnerability checking"
                        }
                    }
                }
            }


            jar {
                archiveClassifier = 'R3-internal'
            }
        }
    }
}